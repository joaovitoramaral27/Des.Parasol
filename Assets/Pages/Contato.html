<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agência de Viagens: Parasol</title>
    <link rel="icon" sizes="48x48" href="../Img/LogoBackground48x48.png">
    <link rel="stylesheet" href="../Css/Contato.css">
    
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="../../index.html"><img src="../Img/LogoBackground512x512.png" alt="Logo Parasol"></a>
                <h2>PARASOL - Contato</h2>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../Pages/SobreNos.html">Sobre Nós</a></li>
                <li><a href="../Pages/Contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <div class ="container">
        <div class="texto">
        <h1 class="contato">Entre em Contato Conosco</h1>
        <p><strong>Você pode nos contatar através dos seguintes canais:</strong></p>
        <ul>
            <li><strong>Email:</strong> contato@parasol.com</li>
            <li><strong>Telefone:</strong> (xx) xxxx-xxxx</li>
            <li><strong>Endereço:</strong> Rua Paralamas xxx - Do Sucesso/PS</li>
        </ul>
        </div>
        <div class ="formulario">
            <h1 class="contato">Envie uma Mensagem</h1>
            <form class="formulario-preenchivel">
                <label for="tipo">Categoria:</label>
                <select id="tipo" name="tipo">
                    <option>Sugestão</option>
                    <option>Reclamação</option>
                    <option>Avaliação</option>
                    <option>Outro</option>
                </select>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
</body>
</html>
